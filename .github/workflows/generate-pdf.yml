name: Generate and Deploy Resume

on:
  push:
    branches:
      - main # или master
    paths:
      - "resume.json"
      - "custom-theme/**" # Запускать сборку при любых изменениях в коде шаблона

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачивание кода
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Установка Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      # 3. Установка основных зависимостей проекта (resumed, puppeteer, handlebars, moment)
      - name: Install core dependencies
        run: npm ci

      # 4. Подготовка папки для публикации сайта
      - name: Prepare build directory
        run: mkdir -p public

      # 5. Рендеринг HTML веб-страницы с использованием локального шаблона
      - name: Export HTML
        run: npx resumed render -o public/index.html -t "$(pwd)/custom-theme/index.js"

      # 6. Генерация PDF в папку public с использованием локального шаблона
      - name: Export PDF
        run: npx resumed export -o public/resume.pdf -t "$(pwd)/custom-theme/index.js" --puppeteer-arg="--no-sandbox" --wait-until networkidle0

      # 7. Сохранение PDF обратно в ветку репозитория (внутри папки public)
      # Используем флаг -f (force) на случай, если папка public находится в вашем .gitignore
      - name: Commit and push PDF
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -f public/resume.pdf
          if git diff --cached --quiet; then
            echo "PDF не изменился"
          else
            git commit -m "chore: auto-generate public/resume.pdf with custom local theme [skip ci]"
            git push
          fi

      # 8. Загрузка папки public на GitHub Pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "public"

      # 9. Публикация сайта на GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
